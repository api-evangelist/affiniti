aid: affiniti
name: Affiniti
description: >-
  Affiniti is the channel-marketing software company founded in Sydney, Australia by Joel
  Montgomery and listed under that name on the EquityZen secondary market; it traded for most of
  its life as OneAffiniti and, after Capstreet-backed Incentive Solutions acquired it in April
  2021, the combined business rebranded to Extu in September 2023, the brand its product and every
  live web property carry today. It sells a through-channel marketing automation and channel
  incentive platform that suppliers and distributors use to run co-branded campaigns, content
  syndication, rewards, rebates, SPIFFs and attribution for their reseller partners in technology,
  building, automotive, energy, insurance and medical channels. It is a SaaS product and managed
  service: its own llms.txt and full XML sitemap list no developer portal, API reference, SDK or
  machine-readable contract of any kind.
