  detail: >-
    Affiniti — trading today as Extu after the OneAffiniti / Incentive Solutions merger — sells a
    through-channel marketing and incentive SaaS platform as an end-user product and a managed
    service, and publishes no developer program of any kind: its own llms.txt indexes 661 pages
    and its three XML sitemaps every public URL, and neither names a developer portal, API
    reference, SDK, webhook or specification, while every OpenAPI/GraphQL/MCP/agent-card path
    probed on extu.com, oneaffiniti.com, app.extu.com and the cms-api.extu.com backend the
    Partner Experience app actually calls returns 404 (a Laravel "route could not be found" JSON
    body on cms-api, including for a random control path). The only machine-readable documents any
    Extu host serves are the OpenID Connect discovery documents for the two Auth0 tenants behind
    its CMS and partner logins, which are sign-in metadata for humans, not an API contract.
